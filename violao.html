<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#082a4f">
  <title>Violão — Cifras da Missa</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-mode="guitar">

  <div class="app-shell">
    <main class="app-sheet">

      <header class="top-banner">
        <div class="banner-left">
          <div class="banner-mark"><img src="assets/equipe-musica-simbolo.png" alt=""></div>
          <div class="banner-copy">
            <h1>Cifras da Missa</h1>
            <div class="sub">23º Domingo do Tempo Comum · Violão</div>
          </div>
        </div>

        <div></div>

        <div class="banner-logos">
          <div class="brand-badge"><img src="assets/brasao-capela.png" alt=""></div>
          <div class="brand-badge"><img src="assets/brasao-3dn.png" alt=""></div>
          <div class="brand-badge"><img src="assets/marinha-do-brasil.png" alt=""></div>
        </div>
      </header>

      <header class="song-head">
        <div class="song-number" id="songNumber">01</div>
        <div>
          <div class="song-role" id="songRole"></div>
          <div class="song-title" id="songTitle"></div>
        </div>
        <div class="head-right">

    <div class="key-panel" id="keyPanel">
      <span class="key-readout">Orig.: <b id="originalKey">—</b></span>
      <button id="transposeDown" aria-label="Descer meio tom">−½</button>
      <select id="keySelect" aria-label="Escolher tom">
        <option>C</option><option>C#</option><option>Db</option><option>D</option><option>Eb</option><option>E</option>
        <option>F</option><option>F#</option><option>Gb</option><option>G</option><option>Ab</option><option>A</option><option>Bb</option><option>B</option>
      </select>
      <button id="transposeUp" aria-label="Subir meio tom">+½</button>
      <button id="resetKey" aria-label="Restaurar tom original">↺</button>
      <span class="key-readout">Tom: <b id="currentKey">—</b></span>
    </div>

          <div class="counter" id="songCounter"></div>
        </div>
      </header>

      <section class="song-body" id="songStage"></section>
    </main>

    <nav class="controls">
      <button class="ctrl" id="prevSong"><span class="arrow">‹</span><span class="txt">Anterior</span></button>
      <label class="ctrl main" for="menuToggle">☰ <span class="txt">Repertório</span></label>
      <button class="ctrl" id="nextSong"><span class="txt">Próxima</span><span class="arrow">›</span></button>
    </nav>
  </div>


<input type="checkbox" id="menuToggle">
<label class="scrim" for="menuToggle"></label>

<aside class="drawer">
  <div class="drawer-head">
    <label class="close" for="menuToggle">×</label>
    <div class="drawer-logo">
      <img src="assets/equipe-musica-completo.png" alt="Equipe de Música">
    </div>
    <div>
      <h1>Cifras da Missa</h1>
      <div class="drawer-lit">23º Domingo do Tempo Comum</div>
      <div class="drawer-place">Capela Militar · Base Naval de Natal · 06SET2026</div>
    </div>
  </div>

  <div class="drawer-logos">
    <div class="brand-badge"><img src="assets/brasao-capela.png" alt=""></div>
    <div class="brand-badge"><img src="assets/ordinariado-militar.png" alt=""></div>
    <div class="brand-badge"><img src="assets/servico-religioso-marinha.png" alt=""></div>
    <div class="brand-badge"><img src="assets/brasao-3dn.png" alt=""></div>
    <div class="brand-badge"><img src="assets/marinha-do-brasil.png" alt=""></div>
    <div class="brand-badge"><img src="assets/jubileu-colorido.png" alt=""></div>
  </div>

  <nav class="song-menu" id="songMenu"></nav>
</aside>


  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
