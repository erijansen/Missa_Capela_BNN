const massCount=23;
const roleOrder=["ENTRADA","SAUDAÇÃO","ATO PENITENCIAL","GLÓRIA","SALMO","ACLAMAÇÃO AO EVANGELHO","OFERTÓRIO","SANTO","PAI NOSSO","CORDEIRO DE DEUS","CONSAGRAÇÃO","COMUNHÃO","AÇÃO DE GRAÇAS","CANTO FINAL","EXTRA"];
let mode="mass",current=0,transposeSteps=0;
const badge=document.getElementById('badge'),role=document.getElementById('role'),title=document.getElementById('title'),count=document.getElementById('count'),music=document.getElementById('music'),viewport=document.getElementById('viewport'),list=document.getElementById('list'),menuToggle=document.getElementById('menuToggle'),tabMass=document.getElementById('tabMass'),tabLibrary=document.getElementById('tabLibrary'),startScreen=document.getElementById('startScreen');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const NOTE_PC={'C':0,'B#':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'Fb':4,'F':5,'E#':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11,'Cb':11},SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function shiftNote(n,steps,useFlats){if(!(n in NOTE_PC))return n;return (useFlats?FLAT:SHARP)[(NOTE_PC[n]+steps+120)%12]}
function transposeChordToken(tok,steps){const m=tok.match(/^([A-G](?:#|b)?)([^\/\s]*)(?:\/([A-G](?:#|b)?))?$/);if(!m)return tok;const useFlats=steps<0||/b/.test(tok);return shiftNote(m[1],steps,useFlats)+m[2]+(m[3]?'/'+shiftNote(m[3],steps,useFlats):'')}
function transposeChordLine(line,steps){if(!steps)return line;return line.replace(/(^|\s|\()([A-G](?:#|b)?(?:m|maj|M|dim|aug|sus|add)?\d*(?:\/\d+)?(?:\/[A-G](?:#|b)?)?)(?=\s|\)|$)/g,(all,p,ch)=>p+transposeChordToken(ch,steps))}
function toneLabel(){return transposeSteps===0?'Tom':(transposeSteps>0?'+'+transposeSteps:transposeSteps)}
function isChordLine(line){const s=line.trim();if(!s)return false;if(/^Tom\s*:/i.test(s))return true;if(/^\(.*\)$/.test(s)&&/[A-G]/.test(s))return true;const toks=s.replace(/[().]/g,' ').split(/\s+/).filter(Boolean);return toks.length>0&&toks.every(t=>/^[A-G](?:#|b)?(?:m|maj|M|dim|aug|sus|add)?\d*(?:\/[A-G](?:#|b)?)?$/.test(t))}
function renderRaw(lines){return lines.map(line=>{const s=line.trim();let cls='source-line';if(isChordLine(line))cls+=' chord-line';else if(/^\[.*\]$/.test(s)||/^(FINAL|REFRÃO|2ª PARTE)$/i.test(s))cls+=' label-line';const shown=isChordLine(line)?transposeChordLine(line,transposeSteps):line;return '<div class="'+cls+'">'+(shown?esc(shown):'&nbsp;')+'</div>'}).join('')}
function fit(){const max=31,min=7.4;let lo=min,hi=max,best=min;for(let k=0;k<22;k++){let mid=(lo+hi)/2;music.style.fontSize=mid+'px';void music.offsetHeight;if(music.scrollWidth<=viewport.clientWidth&&music.scrollHeight<=viewport.clientHeight){best=mid;lo=mid}else hi=mid}music.style.fontSize=Math.max(min,best-.06).toFixed(2)+'px'}
function visibleIndexes(){return mode==='mass'?[...Array(Math.min(massCount,songs.length)).keys()]:[...Array(songs.length).keys()]}
function rebuildList(){list.innerHTML='';tabMass.classList.toggle('active',mode==='mass');tabLibrary.classList.toggle('active',mode==='library');if(mode==='mass'){songs.slice(0,massCount).forEach((s,i)=>addItem(s,i))}else{for(const r of roleOrder){const matches=songs.map((s,i)=>[s,i]).filter(([s])=>s.role===r);if(!matches.length)continue;const h=document.createElement('div');h.className='category';h.textContent=r;list.appendChild(h);matches.forEach(([s,i])=>addItem(s,i))}}}
function addItem(s,i){const b=document.createElement('button');b.className='item';b.dataset.index=i;b.innerHTML='<span class="itemnum">'+String(s.num).padStart(2,'0')+'</span><span class="itemcopy"><span class="itemrole">'+esc(s.role)+'</span><span class="itemtitle">'+esc(s.title)+'</span></span>';b.onclick=()=>{menuToggle.checked=false;render(i)};list.appendChild(b)}
function render(i){current=(i+songs.length)%songs.length;const s=songs[current];badge.textContent=String(s.num).padStart(2,'0');role.textContent=s.role;title.textContent=s.title;count.textContent=(current+1)+' / '+songs.length;music.innerHTML=renderRaw(s.raw);document.getElementById('keyReset').textContent=toneLabel();document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',+e.dataset.index===current));requestAnimationFrame(()=>requestAnimationFrame(fit));history.replaceState(null,'','#musica-'+s.num)}
function step(dir){const idxs=visibleIndexes();let p=idxs.indexOf(current);if(p<0){mode='library';rebuildList();p=idxs.indexOf(current)}render(idxs[(p+dir+idxs.length)%idxs.length])}
tabMass.onclick=()=>{mode='mass';rebuildList();render(Math.min(current,massCount-1))};tabLibrary.onclick=()=>{mode='library';rebuildList();render(current)};
rebuildList();document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('homeBtn').onclick=()=>{menuToggle.checked=false;startScreen.style.display='flex';history.replaceState(null,'',location.pathname+location.search)};document.getElementById('keyDown').onclick=()=>{transposeSteps--;render(current)};document.getElementById('keyUp').onclick=()=>{transposeSteps++;render(current)};document.getElementById('keyReset').onclick=()=>{transposeSteps=0;render(current)};
window.addEventListener('resize',()=>setTimeout(fit,100));let x0=null,y0=null;document.addEventListener('touchstart',e=>{if(menuToggle.checked||e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(x0===null||menuToggle.checked)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=y0=null;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.25)step(dx<0?1:-1)},{passive:true});
function enter(view,theme=false){transposeSteps=0;document.body.classList.toggle('lyrics-only',view==='lyrics');startScreen.style.display='none';render(0);if(theme){mode='library';rebuildList();menuToggle.checked=true}}
document.getElementById('startCifras').onclick=()=>enter('chords');document.getElementById('startLetras').onclick=()=>enter('lyrics');document.getElementById('startTemas').onclick=()=>enter('chords',true);if(location.hash)history.replaceState(null,'',location.pathname+location.search);
</script></body></html>
