const massCount=14;
const roleOrder=["ENTRADA","SAUDAÇÃO","ATO PENITENCIAL","GLÓRIA","SALMO","ACLAMAÇÃO AO EVANGELHO","OFERTÓRIO","SANTO","PAI NOSSO","CORDEIRO DE DEUS","NO MOMENTO DA CONSAGRAÇÃO","COMUNHÃO","AÇÃO DE GRAÇAS","CANTO FINAL","EXTRA"];
let mode="mass"; let current=0; const badge=document.getElementById('badge'),role=document.getElementById('role'),title=document.getElementById('title'),count=document.getElementById('count'),music=document.getElementById('music'),viewport=document.getElementById('viewport'),list=document.getElementById('list'),menuToggle=document.getElementById('menuToggle'),tabMass=document.getElementById('tabMass'),tabLibrary=document.getElementById('tabLibrary');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderBlocks(blocks){let h='',open=false;const os=()=>{if(!open){h+='<div class="stanza">';open=true}},cs=()=>{if(open){h+='</div>';open=false}};for(const b of blocks){if(b.type==='space'){cs();continue}os();if(b.type==='label')h+='<div class="label">'+esc(b.text)+'</div>';else if(b.type==='text')h+='<div class="pair"><div class="chord"></div><div class="lyric">'+esc(b.text)+'</div></div>';else h+='<div class="pair"><div class="chord">'+esc(b.chord)+'</div><div class="lyric">'+esc(b.lyric)+'</div></div>'}cs();return h}
function fit(){const max=31,min=7.4;let lo=min,hi=max,best=min;for(let k=0;k<22;k++){let mid=(lo+hi)/2;music.style.fontSize=mid+'px';void music.offsetHeight;if(music.scrollWidth<=viewport.clientWidth && music.scrollHeight<=viewport.clientHeight){best=mid;lo=mid} else hi=mid}music.style.fontSize=Math.max(min,best-.06).toFixed(2)+'px'}
function visibleIndexes(){return mode==='mass'?[...Array(Math.min(massCount,songs.length)).keys()]:[...Array(songs.length).keys()]}
function rebuildList(){list.innerHTML='';tabMass.classList.toggle('active',mode==='mass');tabLibrary.classList.toggle('active',mode==='library');if(mode==='mass'){songs.slice(0,massCount).forEach((s,i)=>addItem(s,i));}else{for(const r of roleOrder){const matches=songs.map((s,i)=>[s,i]).filter(([s])=>s.role===r);if(!matches.length)continue;const h=document.createElement('div');h.className='category';h.textContent=r;list.appendChild(h);matches.forEach(([s,i])=>addItem(s,i));}}}
function addItem(s,i){const b=document.createElement('button');b.className='item';b.dataset.index=i;b.innerHTML='<span class="itemnum">'+String(s.num).padStart(2,'0')+'</span><span class="itemcopy"><span class="itemrole">'+esc(s.role)+'</span><span class="itemtitle">'+esc(s.title)+'</span></span>';b.onclick=()=>{menuToggle.checked=false;render(i)};list.appendChild(b)}
function render(i){current=(i+songs.length)%songs.length;const s=songs[current];badge.textContent=String(s.num).padStart(2,'0');role.textContent=s.role;title.textContent=s.title;count.textContent=(current+1)+' / '+songs.length;music.innerHTML=renderBlocks(s.blocks);document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',+e.dataset.index===current));requestAnimationFrame(()=>requestAnimationFrame(fit));history.replaceState(null,'','#musica-'+s.num)}
function step(dir){const idxs=visibleIndexes();let p=idxs.indexOf(current);if(p<0){mode='library';rebuildList();p=idxs.indexOf(current)}const target=idxs[(p+dir+idxs.length)%idxs.length];render(target)}
tabMass.onclick=()=>{mode='mass';rebuildList();render(Math.min(current,massCount-1))};tabLibrary.onclick=()=>{mode='library';rebuildList();render(current)};
rebuildList();document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);window.addEventListener('resize',()=>setTimeout(fit,100));let x0=null,y0=null;document.addEventListener('touchstart',e=>{if(menuToggle.checked||e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(x0===null||menuToggle.checked)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=y0=null;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.25)step(dx<0?1:-1)},{passive:true});const mh=location.hash.match(/musica-(\d+)/);if(mh){const idx=songs.findIndex(s=>s.num===+mh[1]);render(idx>=0?idx:0)}else render(0);
</script></body></html>
