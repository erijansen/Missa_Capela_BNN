<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#082a4f">

<link rel="icon" type="image/png" sizes="512x512" href="assets/site-logo.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="Cifras da Missa — Capela Militar BNN">
<meta property="og:description" content="Repertório litúrgico da Capela Militar da Base Naval de Natal.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Cifras da Missa — Capela Militar BNN">
<meta name="twitter:description" content="Repertório litúrgico da Capela Militar da Base Naval de Natal.">
<meta name="twitter:image" content="assets/og-image.png">
  <title>Canto — Cifras da Missa</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-mode="singer">

  <div class="app-shell">
    <main class="app-sheet">

      <header class="top-banner">
        <div class="banner-left">
          <div class="banner-mark"><img src="assets/site-logo.png" alt=""></div>
          <div class="banner-copy">
            <h1>Cifras da Missa</h1>
            <div class="sub">23º Domingo do Tempo Comum · Canto</div>
          </div>
        </div>

        <a class="home-link" href="index.html" aria-label="Voltar para a escolha do módulo">← <span class="label">Módulos</span></a>

        <div class="banner-logos">
          <div class="brand-badge"><img src="assets/brasao-capela.png" alt=""></div>
          <div class="brand-badge"><img src="assets/brasao-3dn.png" alt=""></div>
          <div class="brand-badge"><img src="assets/simbolo-marinha-home.png" alt=""></div>
        </div>
      </header>

      <header class="song-head">
        <div class="song-number" id="songNumber">01</div>
        <div>
          <div class="song-role" id="songRole"></div>
          <div class="song-title" id="songTitle"></div>
        </div>
        <div class="head-right">
          <div id="keyPanel" hidden></div>
          <div class="counter" id="songCounter"></div>
        </div>
      </header>

      <section class="song-body" id="songStage"></section>
    </main>

    <nav class="controls">
      <button class="ctrl" id="prevSong"><span class="arrow">‹</span><span class="txt">Anterior</span></button>
      <label class="ctrl main" for="menuToggle">☰ <span class="txt">Repertório</span></label>
      <button class="ctrl" id="nextSong"><span class="txt">Próxima</span><span class="arrow">›</span></button>
    </nav>
  </div>


<input type="checkbox" id="menuToggle">
<label class="scrim" for="menuToggle"></label>

<aside class="drawer">
  <div class="drawer-head">
    <label class="close" for="menuToggle">×</label>
    <div class="drawer-logo">
      <img src="assets/equipe-musica-completo.png" alt="Equipe de Música">
    </div>
    <div>
      <h1>Cifras da Missa</h1>
      <div class="drawer-lit">23º Domingo do Tempo Comum</div>
      <div class="drawer-place">Capela Militar · Base Naval de Natal · 06SET2026</div>
    </div>
  </div>

  <div class="drawer-logos">
    <div class="brand-badge"><img src="assets/brasao-capela.png" alt=""></div>
    <div class="brand-badge"><img src="assets/ordinariado-militar.png" alt=""></div>
    <div class="brand-badge"><img src="assets/servico-religioso-marinha.png" alt=""></div>
    <div class="brand-badge"><img src="assets/brasao-3dn.png" alt=""></div>
    <div class="brand-badge"><img src="assets/simbolo-marinha-home.png" alt=""></div>
    <div class="brand-badge"><img src="assets/jubileu-colorido.png" alt=""></div>
  </div>

  <nav class="song-menu" id="songMenu"></nav>
</aside>


  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
